name: NetSuite Deployment

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUITECLOUD_CI: 1
      SUITECLOUD_CI_PASSKEY: ${{ secrets.SUITECLOUD_CI_PASSKEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install SuiteCloud CLI
        run: |
          npm install -g @oracle/suitecloud-cli --acceptsuitecloudsdklicense

      - name: Create Private Key File
        env:
          NS_PRIVATE_KEY: ${{ secrets.NS_PRIVATE_KEY }}
        run: |
          echo "$NS_PRIVATE_KEY" > private_key.pem

      - name: Verify Private Key
        run: |
          echo "Checking private key..."
          head -1 private_key.pem
          tail -1 private_key.pem
          openssl pkey -in private_key.pem -check -noout

      - name: Authenticate with NetSuite
        env:
          NS_ACCOUNT_ID: ${{ secrets.NS_ACCOUNT_ID }}
          NS_CERTIFICATE_ID: ${{ secrets.NS_CERTIFICATE_ID }}
        run: |
          suitecloud account:setup:ci \
            --authid ci_auth \
            --account "$NS_ACCOUNT_ID" \
            --certificateid "$NS_CERTIFICATE_ID" \
            --privatekeypath private_key.pem

      - name: Validate SDF Project
        run: |
          suitecloud project:validate \
            --authid ci_auth

      - name: Deploy to NetSuite
        run: |
          suitecloud project:deploy \
            --authid ci_auth \
            --accountspecificvalues WARNING \
            --applyinstallprefs

      - name: Cleanup
        if: always()
        run: |
          rm -f private_key.pem