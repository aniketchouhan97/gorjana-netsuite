name: NetSuite Deployment

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate, Validate, and Deploy (Token-Based via Docker)
        env:
          NS_ACCOUNT_ID: ${{ secrets.NS_ACCOUNT_ID }}
          NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
          SUITECLOUD_CI_PASSKEY: ${{ secrets.SUITECLOUD_CI_PASSKEY }}
        run: |
          # The latest SuiteCloud CLI does not support Token-Based Auth (TBA) in CI environments.
          # We use an older CLI version via Docker (1.9.0) that still has the account:savetoken command.
          # We pass SUITECLOUD_CI and SUITECLOUD_CI_PASSKEY to prevent the credential save error.
          docker run --rm --entrypoint sh --user root \
            -e HOME=/app \
            -e SUITECLOUD_CI=1 \
            -e SUITECLOUD_CI_PASSKEY="$SUITECLOUD_CI_PASSKEY" \
            -e NS_ACCOUNT_ID="$NS_ACCOUNT_ID" \
            -e NS_TOKEN_ID="$NS_TOKEN_ID" \
            -e NS_TOKEN_SECRET="$NS_TOKEN_SECRET" \
            -v ${{ github.workspace }}:/app -w /app skumail/suitecloud-cli:1.9.0-alpine -c "\
            npm install && \
            export SUITECLOUD_CI_PASSKEY='$SUITECLOUD_CI_PASSKEY' && \
            suitecloud account:savetoken \
              --account \"$NS_ACCOUNT_ID\" \
              --authid \"ci_auth\" \
              --tokenid \"$NS_TOKEN_ID\" \
              --tokensecret \"$NS_TOKEN_SECRET\" && \
            suitecloud project:validate --authid ci_auth && \
            suitecloud project:deploy \
              --accountspecificvalues WARNING \
              --applyinstallprefs \
              --authid ci_auth"