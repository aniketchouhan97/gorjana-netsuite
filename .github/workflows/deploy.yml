name: Deploy to NetSuite

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SuiteCloud CLI
        run: npm install -g @oracle/suitecloud-cli --acceptsuitecloudsdklicense

      - name: Authenticate with NetSuite (Token-Based)
        env:
          NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
        run: |
          suitecloud account:setup:ci \
            --authid "github_deploy" \
            --account "${{ secrets.NS_ACCOUNT_ID }}" \
            --tokenid "$NS_TOKEN_ID" \
            --tokensecret "$NS_TOKEN_SECRET"

      - name: Deploy SuiteCloud Project
        run: suitecloud project:deploy --accountspecificvalues WARNING --logfcconflicts
