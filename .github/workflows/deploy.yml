name: Deploy to NetSuite

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate and Deploy with NetSuite (Token-Based)
        env:
          NS_ACCOUNT_ID: ${{ secrets.NS_ACCOUNT_ID }}
          NS_TOKEN_ID: ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET: ${{ secrets.NS_TOKEN_SECRET }}
        run: |
          # Use an older SuiteCloud CLI (1.9.0) via Docker that still supports Token-Based Authentication (TBA).
          # The command account:savetoken is run first, immediately followed by project:deploy in the same container.
          docker run --rm --entrypoint sh \
            -e SUITECLOUD_CI=1 \
            -e SUITECLOUD_CI_PASSKEY="GitHubActionsPasskey1234567890123456" \
            -v ${{ github.workspace }}:/app -w /app skumail/suitecloud-cli:1.9.0-alpine -c "\
            suitecloud account:savetoken \
              --account \"$NS_ACCOUNT_ID\" \
              --authid \"github_deploy\" \
              --tokenid \"$NS_TOKEN_ID\" \
              --tokensecret \"$NS_TOKEN_SECRET\" && \
            suitecloud project:deploy --accountspecificvalues WARNING --logfcconflicts"
