name: NetSuite Deployment

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SuiteCloud CLI
        run: npm install -g @oracle/suitecloud-cli

      - name: Authenticate
        run: |
          suitecloud account:setup:ci \
            --account ${{ secrets.NS_ACCOUNT }} \
            --authid ci_auth \
            --tokenid ${{ secrets.NS_TOKEN_ID }} \
            --tokensecret ${{ secrets.NS_TOKEN_SECRET }} \
            --consumerkey ${{ secrets.NS_CONSUMER_KEY }} \
            --consumersecret ${{ secrets.NS_CONSUMER_SECRET }}

      - name: Validate Project
        run: suitecloud project:validate --authid ci_auth

      - name: Deploy to Sandbox
        run: |
          suitecloud project:deploy \
            --accountspecificvalues WARNING \
            --applyinstallprefs \
            --authid ci_auth