name: NetSuite Deployment

on:
  push:
    branches:
      - develop

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SuiteCloud CLI
        run: npm install -g @oracle/suitecloud-cli --acceptsuitecloudsdklicense

      - name: Authenticate with NetSuite (M2M)
        env:
          NS_CERTIFICATE_ID: ${{ secrets.NS_CERTIFICATE_ID }}
          NS_PRIVATE_KEY: ${{ secrets.NS_PRIVATE_KEY }}
        run: |
          # Write the private key to a file for the CLI to use
          echo "$NS_PRIVATE_KEY" > private_key.pem
          
          # Use Machine-to-Machine (M2M) authentication
          suitecloud account:setup:ci \
            --authid "ci_auth" \
            --account "${{ secrets.NS_ACCOUNT_ID }}" \
            --certificateid "$NS_CERTIFICATE_ID" \
            --privatekeypath "private_key.pem"
            
          # Clean up the private key
          rm private_key.pem

      - name: Validate Project
        run: suitecloud project:validate --authid ci_auth

      - name: Deploy to Sandbox
        run: |
          suitecloud project:deploy \
            --accountspecificvalues WARNING \
            --applyinstallprefs \
            --authid ci_auth